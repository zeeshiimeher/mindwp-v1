interface:
  display_name: "MindWP Design Eye"
  short_description: "Judge whether a built MindWP page is visually good"
  default_prompt: "Use $mindwp-design-eye to capture this MindWP page, read the full page before the section crops, and return a ranked visual verdict against the approved page plan and docs/DESIGN.md, covering rhythm, payload legibility, object craft and emphasis, and saying for each finding whether it needs a redesign or a technical repair. Judge and report only: write no code and change no files."
